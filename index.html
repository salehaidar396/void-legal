<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID — Legal</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    color: #ffffff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }
  header {
    border-bottom: 1px solid #222;
    padding-bottom: 24px;
    margin-bottom: 40px;
  }
  header .app-name {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 0;
  }
  header .sub {
    color: #888;
    font-size: 14px;
    margin-top: 6px;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }
  p.lead {
    color: #aaa;
    margin: 0 0 32px;
  }
  .links {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .links li {
    margin-bottom: 16px;
  }
  .links a {
    display: block;
    padding: 20px 24px;
    background: #141414;
    border: 1px solid #222;
    border-radius: 10px;
    color: #ffffff;
    text-decoration: none;
    font-size: 18px;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
  }
  .links a:hover {
    border-color: #444;
    background: #1a1a1a;
  }
  .links a .arrow {
    color: #6cb6ff;
    margin-left: 8px;
  }
  footer {
    border-top: 1px solid #222;
    margin-top: 60px;
    padding-top: 24px;
    color: #888;
    font-size: 14px;
  }
  footer a {
    color: #6cb6ff;
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
  @media (max-width: 600px) {
    .wrap { padding: 40px 16px 60px; }
    h1 { font-size: 24px; }
    .links a { font-size: 16px; padding: 16px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="app-name">VOID</div>
    <div class="sub">Legal</div>
  </header>

  <h1>Legal</h1>
  <p class="lead">VOID's policies and terms, all in one place.</p>

  <ul class="links">
    <li><a href="privacy-policy.html">Privacy Policy <span class="arrow">→</span></a></li>
    <li><a href="terms-of-service.html">Terms of Service <span class="arrow">→</span></a></li>
  </ul>

  <footer>
    Questions? Email us at <a href="mailto:saleh.haidar03@gmail.com">saleh.haidar03@gmail.com</a>.
  </footer>
</div>
</body>
</html>
